name: 버그 보고
description: 재현 가능한 오류나 잘못된 결과를 보고합니다.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        민감한 정보나 대용량 데이터 파일은 첨부하지 마세요. 가능한 경우 합성 스모크 데이터로 재현해 주세요.

  - type: textarea
    id: summary
    attributes:
      label: 문제 설명
      description: 발생한 문제와 기대했던 동작을 설명해 주세요.
      placeholder: 무엇이 잘못되었으며 원래 어떻게 동작해야 하나요?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      description: 실행한 명령과 최소 재현 절차를 순서대로 적어 주세요.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 오류 로그
      description: 전체 traceback 또는 관련 로그를 붙여 넣어 주세요.
      render: shell

  - type: dropdown
    id: dataset
    attributes:
      label: 관련 데이터 경로
      options:
        - 합성 스모크 데이터
        - EventHDR
        - EventAid-R
        - 데이터와 무관함
        - 확인하지 못함
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 운영체제
      placeholder: 예) Ubuntu 22.04, Windows 11
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python 및 PyTorch 버전
      placeholder: 예) Python 3.11.9, PyTorch 2.4.0+cu121
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: 하드웨어
      description: CPU, GPU 모델과 GPU 사용 시 CUDA 버전을 적어 주세요.
      placeholder: 예) RTX 4090, CUDA 12.1

  - type: textarea
    id: config
    attributes:
      label: 설정 및 추가 정보
      description: 사용한 config, commit SHA, 수정 사항 등 원인 파악에 필요한 내용을 적어 주세요.

  - type: checkboxes
    id: checks
    attributes:
      label: 확인 사항
      options:
        - label: 최신 기본 브랜치에서도 문제가 재현됩니다.
          required: true
        - label: 이슈에 개인 정보, 인증 정보 또는 비공개 데이터가 포함되지 않았습니다.
          required: true
