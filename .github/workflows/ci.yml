name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Conda Python 3.12.14
        uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3
        with:
          activate-environment: asgcn
          miniforge-version: "26.5.3-0"
          python-version: "3.12.14"
          channels: conda-forge
          channel-priority: strict
          auto-activate-base: false

      - name: Exercise the Linux server setup entrypoint
        env:
          REQUIRE_CUDA: 0
        run: bash scripts/setup.sh

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run tests with the locked Python 3.12 profile
        run: python -m pytest -q

      - name: Verify deterministic code snapshot
        run: python scripts/build_code_summary.py --check

      - name: Verify trusted main clean snapshot provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/build_code_summary.py --check --require-clean-provenance

      - name: Scan tracked text with generic privacy rules
        run: python scripts/scan_private_text.py --all-tracked

      - name: Scan trusted main history with generic privacy rules
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: >
          python scripts/scan_private_text.py
          --all-tracked
          --all-history

      - name: Validate Linux shell entrypoints
        run: |
          for script in scripts/*.sh server/*.sbatch server/*.pbs; do
            bash -n "$script" || exit 1
          done

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install editable development package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run unit and end-to-end tests
        run: python -m pytest -q
